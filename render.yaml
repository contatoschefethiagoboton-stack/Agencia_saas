# Blueprint do Render: Dashboard → New → Blueprint → escolha este repositório.
# Cria a API (Docker), o Redis (Key Value) e o Postgres, já ligados entre si.
# REGIÃO: a Binance bloqueia servidores nos EUA (erro 451). Para robôs de cripto com dinheiro real, o serviço web
# precisa estar em Frankfurt ou Singapura. A região só é escolhida na criação do serviço no Render (não dá para mudar depois):
# se o seu está em Oregon/Ohio/Virginia, crie um serviço novo em Frankfurt. Gráficos e sinais funcionam em qualquer região.
services:
  - type: web
    name: agencia-saas
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agencia-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agencia-redis
          property: connectionString
      # Segredos gerados automaticamente pelo Render (base64 de 256 bits)
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true
      - key: TOKEN_ENC_KEY
        generateValue: true
      - key: APP_NAME               # nome no app autenticador, nos e-mails e no Telegram
        value: Radar Invest
      - key: ASAAS_API_URL
        value: https://api.asaas.com/v3
      # Preenchidos por você no painel do Render (sync: false = o Render pergunta na criação)
      - key: ADMIN_EMAIL          # cria o 1º administrador no deploy
        sync: false
      - key: ADMIN_PASSWORD       # mínimo 10 caracteres; troque depois do 1º login
        sync: false
      - key: ADMIN_PATH           # endereço secreto do login do administrador, ex.: /acesso-painel-7k2 (sem ele: /admin)
        sync: false
      # E-mail para "Esqueci minha senha" (qualquer SMTP: Gmail com senha de app, Zoho, Resend, SendGrid...)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM            # ex.: Radar Invest <nao-responda@seudominio.com.br>
        sync: false
      - key: ASAAS_SPLIT_JSON     # split nativo: [{"walletId":"...","percentualValue":20}]
        sync: false
      - key: PUBLIC_URL
        sync: false
      # ---- Dados de mercado (cripto da Binance é público e não precisa de chave)
      - key: BRAPI_TOKEN            # B3 e FIIs: crie em brapi.dev (sem ele, só os ativos de teste da brapi)
        sync: false
      - key: ALPACA_DATA_KEY        # ações dos EUA: chave gratuita em alpaca.markets (feed IEX)
        sync: false
      - key: ALPACA_DATA_SECRET
        sync: false
      # ---- Avisos no Telegram: crie o bot com o @BotFather
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_NAME      # nome do bot sem @ (aparece para o cliente em Avisos)
        sync: false
      - key: ASAAS_API_KEY          # cobrança dos planos (PIX/cartão) e carteiras (subcontas)
        sync: false
      - key: WALLET_TX_MAX_CENTS    # limite por saída de dinheiro da carteira (R$ 5.000)
        value: "500000"
      - key: WALLET_DAILY_MAX_CENTS # limite diário de saídas por cliente (R$ 10.000)
        value: "1000000"
      - key: ASAAS_WEBHOOK_TOKEN
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false

  - type: keyvalue
    name: agencia-redis
    plan: free
    ipAllowList: []          # só acessível pela rede interna do Render

  # Workers (robôs + radar de lançamentos). No plano free eles rodam dentro do serviço web.
  # Para escalar, descomente e defina RUN_WORKERS_IN_WEB=0 no serviço web.
  # - type: worker
  #   name: agencia-workers
  #   runtime: docker
  #   plan: starter
  #   dockerfilePath: ./Dockerfile
  #   dockerCommand: node dist/workers.js
  #   envVars:               # repita aqui as mesmas variáveis do serviço web

databases:
  - name: agencia-db
    plan: free
    databaseName: agencia
    user: agencia
