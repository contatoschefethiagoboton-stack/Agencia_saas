# Blueprint do Render: Dashboard → New → Blueprint → escolha este repositório.
# Cria a API (Docker), o Redis (Key Value) e o Postgres, já ligados entre si.
services:
  - type: web
    name: agencia-saas
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agencia-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agencia-redis
          property: connectionString
      # Segredos gerados automaticamente pelo Render (base64 de 256 bits)
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true
      - key: TOKEN_ENC_KEY
        generateValue: true
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: META_API_VERSION
        value: v25.0
      - key: ASAAS_API_URL
        value: https://api.asaas.com/v3
      - key: PLATFORM_PROFIT_SHARE_BPS
        value: "6000"
      - key: WITHDRAWAL_DAILY_CAP_CENTS
        value: "2000000"
      # Preenchidos por você no painel do Render (sync: false = o Render pergunta na criação)
      - key: ADMIN_EMAIL          # cria o 1º administrador no deploy
        sync: false
      - key: ADMIN_PASSWORD       # mínimo 10 caracteres; troque depois do 1º login
        sync: false
      - key: ASAAS_SPLIT_JSON     # split nativo: [{"walletId":"...","percentualValue":20}]
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_SYSTEM_TOKEN
        sync: false
      - key: PLATFORM_WA_PHONE_ID
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_BR_BUNDLE_SID
        sync: false
      - key: TWILIO_BR_ADDRESS_SID
        sync: false
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_WEBHOOK_TOKEN
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false

  - type: keyvalue
    name: agencia-redis
    plan: free
    ipAllowList: []          # só acessível pela rede interna do Render

  # Workers (fila do WhatsApp + IA). No plano free eles rodam dentro do serviço web.
  # Para escalar, descomente e defina RUN_WORKERS_IN_WEB=0 no serviço web.
  # - type: worker
  #   name: agencia-workers
  #   runtime: docker
  #   plan: starter
  #   dockerfilePath: ./Dockerfile
  #   dockerCommand: node dist/workers.js
  #   envVars:               # repita aqui as mesmas variáveis do serviço web

databases:
  - name: agencia-db
    plan: free
    databaseName: agencia
    user: agencia
